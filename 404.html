<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="404 — Page not found. Kepler by Emtypyie.">
<title>404 — Kepler</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#05060d;
    --bg-nebula-1:#141b3d;
    --bg-nebula-2:#0a0d1f;
    --accent:#6c7fef;
    --accent-dim:#3d4dc0;
    --text-primary:#e9eaf5;
    --text-muted:#7f87ad;
    --line:rgba(108,127,239,0.28);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,0.85), transparent 100%),
      radial-gradient(1px 1px at 42% 68%, rgba(255,255,255,0.55), transparent 100%),
      radial-gradient(1.5px 1.5px at 72% 38%, rgba(255,255,255,0.75), transparent 100%),
      radial-gradient(1px 1px at 86% 82%, rgba(255,255,255,0.45), transparent 100%),
      radial-gradient(1px 1px at 24% 88%, rgba(255,255,255,0.6), transparent 100%),
      radial-gradient(1.5px 1.5px at 58% 12%, rgba(255,255,255,0.85), transparent 100%),
      radial-gradient(1px 1px at 6% 55%, rgba(255,255,255,0.4), transparent 100%),
      radial-gradient(1px 1px at 95% 20%, rgba(255,255,255,0.5), transparent 100%),
      radial-gradient(ellipse 900px 600px at 50% 42%, var(--bg-nebula-1), var(--bg-nebula-2) 60%, var(--bg-deep) 100%);
    background-repeat: repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, no-repeat;
    background-size: 220px 220px, 220px 220px, 220px 220px, 220px 220px, 220px 220px, 220px 220px, 220px 220px, 220px 220px, cover;
    color:var(--text-primary);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
  }

  .scene{
    position:relative;
    width:min(700px, 92vw);
    padding:3rem 1.5rem;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .orbit-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:auto;
    overflow:visible;
    pointer-events:none;
  }

  .orbit-path{
    fill:none;
    stroke:var(--line);
    stroke-width:1.25;
    stroke-dasharray:3 7;
  }

  .trail-path{
    fill:none;
    stroke:url(#trailFade);
    stroke-width:1.25;
    stroke-dasharray:2 6;
  }

  .lost-dot{
    fill:var(--accent);
    opacity:0.55;
    animation:pulse 3.2s ease-in-out infinite;
  }

  .satellite{
    fill:var(--accent);
    filter:drop-shadow(0 0 6px rgba(108,127,239,0.9));
  }

  @keyframes pulse{
    0%,100%{opacity:0.35; r:2.2;}
    50%{opacity:0.75; r:3;}
  }

  .container{
    position:relative;
    z-index:1;
    text-align:center;
    max-width:420px;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:1.4rem;
  }

  .eyebrow::before{
    content:"● ";
    color:var(--accent);
  }

  h1{
    font-family:'Press Start 2P', monospace;
    font-size:5rem;
    font-weight:400;
    color:var(--accent);
    margin:0 0 1.25rem;
    line-height:1;
    text-shadow:0 0 26px rgba(108,127,239,0.45);
  }

  .msg{
    font-size:1.05rem;
    line-height:1.6;
    color:var(--text-muted);
    margin:0 0 2.25rem;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:0.55rem;
    padding:0.8rem 1.6rem;
    background:var(--accent);
    color:#fff;
    text-decoration:none;
    border-radius:6px;
    font-weight:600;
    font-size:0.95rem;
    transition:background 0.15s, transform 0.15s;
  }
  .btn:hover{ background:var(--accent-dim); transform:translateY(-1px); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  .btn svg{ width:18px; height:18px; }

  .links{
    margin-top:2.25rem;
    display:flex;
    gap:1.25rem;
    justify-content:center;
    flex-wrap:wrap;
    font-family:'JetBrains Mono', monospace;
  }
  .links a{
    color:var(--text-muted);
    text-decoration:none;
    font-size:0.78rem;
    letter-spacing:0.02em;
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    transition:color 0.15s, border-color 0.15s;
  }
  .links a:hover{ color:var(--accent); border-color:var(--accent); }
  .links a:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  .credit{
    margin-top:1.75rem;
    font-family:'JetBrains Mono', monospace;
    font-size:0.68rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#4a5079;
  }

  @media (max-width:480px){
    h1{ font-size:3.4rem; }
    .msg{ font-size:0.95rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .lost-dot{ animation:none; opacity:0.55; }
  }
</style>
</head>
<body>
  <main class="scene">
    <svg class="orbit-svg" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="trailFade" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#6c7fef" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#6c7fef" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <path class="orbit-path" d="M 90,210 A 260,110 0 1,1 610,210 A 260,110 0 1,1 90,210"/>

      <path class="trail-path" d="M 350,100 Q 430,45 505,20"/>
      <circle class="lost-dot" cx="505" cy="20" r="2.6"/>

      <circle class="satellite" r="4.5">
        <animateMotion
          path="M 350,100 A 260,110 0 1,1 349,100 A 260,110 0 1,1 350,100"
          dur="14s"
          repeatCount="indefinite"/>
      </circle>
    </svg>

    <div class="container">
      <p class="eyebrow">Signal lost — sector 404</p>
      <h1>404</h1>
      <p class="msg">This page has drifted out of orbit. It may have been moved, renamed, or it never existed on this trajectory.</p>
      <a href="/" class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Return to Kepler
      </a>
      <nav class="links">
        <a href="https://kepler.emtypyie.in">Main Site</a>
        <a href="https://wiki.emtypyie.in/devlogs/kepler">Documentation</a>
        <a href="https://github.com/emtypyie/kepler">GitHub</a>
      </nav>
      <p class="credit">Maintained by Emtypyie</p>
    </div>
  </main>

  <script>
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.querySelectorAll('svg').forEach(function (svg) {
        if (svg.pauseAnimations) svg.pauseAnimations();
      });
    }
  </script>
</body>
</html>
