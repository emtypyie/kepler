<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile — Kepler</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
</head>
<body>
  <nav>
    <a href="https://kepler.emtypyie.in" class="brand"><svg class="brand-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 17a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2l0 -2"/><path d="M15 17a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2l0 -2"/><path d="M9 5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2l0 -2"/><path d="M6 15v-1a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v1"/><path d="M12 9l0 3"/></svg> Kepler</a>
    <span class="breadcrumb">/ Edit Profile</span>
    <div class="user-menu">
      <div class="avatar" id="userAvatar" onclick="toggleMenu()">U</div>
      <div class="dropdown" id="userDropdown">
        <div class="dropdown-header" id="dropdownUser">User</div>
        <a class="dropdown-item" href="/edit-profile">Edit Profile</a>
        <a class="dropdown-item" href="/settings">Settings</a>
        <a class="dropdown-item" href="/dashboard">Services</a>
        <a class="dropdown-item" href="https://kepler.emtypyie.in/documentation" target="_blank">Documentation</a>
        <a class="dropdown-item" href="https://emtypyie.in" target="_blank">Main Site</a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item danger" onclick="auth.logout()">Sign Out</a>
      </div>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <h1 class="page-title">Edit Profile</h1>
      <button class="btn btn-secondary" id="editBtn" onclick="toggleEdit()">Edit</button>
    </div>

    <section class="settings-section">
      <h2>Avatar</h2>
      <div class="profile-avatar-row">
        <div class="avatar-preview" id="avatarPreview">U</div>
        <div>
          <input type="file" id="avatarInput" accept="image/*" disabled>
          <p class="field-hint">Click Edit to change your avatar</p>
        </div>
      </div>
    </section>

    <section class="settings-section">
      <h2>Email</h2>
      <div class="setting-row">
        <input type="email" id="profileEmail" placeholder="your@email.com" disabled>
        <span class="field-hint" id="emailHint">Click Edit to change</span>
      </div>
    </section>

    <section class="settings-section">
      <h2>Username</h2>
      <div class="setting-row">
        <input type="text" id="profileUsername" placeholder="Username" disabled>
        <button class="btn" onclick="checkUsername()" id="checkUsernameBtn" style="display:none">Check</button>
      </div>
      <div id="usernameStatus" class="field-msg"></div>
      <div id="usernameSuggestions" class="suggestions"></div>
      <button class="btn" onclick="saveUsername()" id="saveUsernameBtn" style="display:none">Save Username</button>
    </section>

    <div id="profileMsg" class="error-msg"></div>
  </main>

  <div class="modal-overlay" id="cropModal" style="display:none">
    <div class="modal-box">
      <h2>Crop Avatar</h2>
      <div class="crop-container">
        <img id="cropImage" style="max-width:100%">
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="commitCrop()">Commit</button>
        <button class="btn btn-secondary" onclick="closeCrop()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="unsavedBar" class="unsaved-bar" style="display:none">
    <span>You have unsaved changes</span>
    <div class="unsaved-actions">
      <button class="btn" onclick="handleUnsaved('commit')">Commit Changes</button>
      <button class="btn btn-danger" onclick="handleUnsaved('discard')">Discard</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
