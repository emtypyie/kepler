<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Kepler</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script>let _u;try{_u=JSON.parse(localStorage.getItem('kepler_user')||sessionStorage.getItem('kepler_user'))}catch{}if(!_u||!_u.token){location.href='/'}</script>
</head>
<body>
  <nav>
    <a href="https://kepler.emtypyie.in" class="brand"><svg class="brand-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 17a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2l0 -2"/><path d="M15 17a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2l0 -2"/><path d="M9 5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2l0 -2"/><path d="M6 15v-1a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v1"/><path d="M12 9l0 3"/></svg> Kepler</a>
    <span class="breadcrumb">/ Settings</span>
    <div class="user-menu">
      <div class="avatar" id="userAvatar" onclick="toggleMenu()">U</div>
      <div class="dropdown" id="userDropdown">
        <div class="dropdown-header" id="dropdownUser">User</div>
        <a class="dropdown-item" href="/edit-profile">Edit Profile</a>
        <a class="dropdown-item" href="/settings">Settings</a>
        <a class="dropdown-item" href="/dashboard">Services</a>
        <a class="dropdown-item" href="https://wiki.emtypyie.in/devlogs/kepler" target="_blank">Documentation</a>
        <a class="dropdown-item" href="https://emtypyie.in" target="_blank">Main Site</a>
        <div class="dropdown-divider"></div>
        <a class="dropdown-item danger" onclick="auth.logout()">Sign Out</a>
      </div>
    </div>
  </nav>

  <main>
    <h1 class="page-title">Settings</h1>

    <section class="settings-section">
      <h2>Backend Connection</h2>
      <div class="setting-row">
        <label>Backend URL</label>
        <input type="text" id="backendUrl" placeholder="http://localhost:41783">
        <button class="btn" onclick="saveBackendUrl()">Save</button>
      </div>
      <div class="setting-row">
        <label>Status</label>
        <span id="backendStatus">Checking...</span>
        <button class="btn btn-secondary" onclick="checkBackend()">Test</button>
      </div>
    </section>

    <section class="settings-section">
      <h2>Account</h2>
      <div class="setting-row">
        <label>Username</label>
        <span id="settingsUser"></span>
      </div>
      <div class="setting-row">
        <label>Change Password</label>
        <input type="password" id="currentPass" placeholder="Current password">
        <input type="password" id="newPass" placeholder="New password">
        <button class="btn" onclick="changePassword()">Update</button>
      </div>
      <div class="setting-row">
        <label>Delete Account</label>
        <button class="btn btn-danger" onclick="deleteAccount()">Delete My Account</button>
      </div>
    </section>

    <div id="settingsMsg" class="error-msg"></div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
