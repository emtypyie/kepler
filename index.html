<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kepler — Local Services</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1 class="logo">✦ Kepler</h1>
      <p class="subtitle">Your local service hub</p>

      <div id="authForms">
        <div id="loginForm">
          <h2>Sign In</h2>
          <input type="text" id="loginUser" placeholder="Username" autocomplete="username">
          <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
          <label class="checkbox-row">
            <input type="checkbox" id="staySignedIn"> Stay signed in
          </label>
          <button class="btn" onclick="auth.login()">Sign In</button>
          <p class="switch">No account? <a href="#" onclick="auth.toggle()">Sign up</a></p>
        </div>

        <div id="signupForm" style="display:none">
          <h2>Create Account</h2>
          <input type="text" id="signupUser" placeholder="Username" autocomplete="username">
          <input type="password" id="signupPass" placeholder="Password" autocomplete="new-password">
          <input type="password" id="signupConfirm" placeholder="Confirm password" autocomplete="new-password">
          <button class="btn" onclick="auth.signup()">Create Account</button>
          <p class="switch">Already have one? <a href="#" onclick="auth.toggle()">Sign in</a></p>
        </div>
      </div>

      <div id="authError" class="error-msg"></div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
